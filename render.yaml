# Blueprint opcional de Render: crea la base PostgreSQL y el servicio web (Docker) con un solo clic.
# En Render: New + > Blueprint > seleccionar este repositorio.
services:
  - type: web
    name: cargobox-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cargobox-db
          property: connectionString

databases:
  - name: cargobox-db
    plan: free
