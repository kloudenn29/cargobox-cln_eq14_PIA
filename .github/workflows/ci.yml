name: CargoBox CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificación de estilo con Ruff
        run: ruff check src tests

      - name: Pruebas unitarias y de integración (cobertura mínima 80 %)
        run: pytest -v

      - name: Verificación de casos oficiales del dataset
        run: python scripts/ejecutar_casos_alumno.py

      - name: Demo real de las reglas de negocio (57 pasos verificados)
        run: python scripts/demo.py

  docker:
    name: Docker Compose (DB + App)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar DB y App con Docker Compose
        run: docker compose up -d --build db app

      - name: Esperar y verificar /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Apagar servicios
        if: always()
        run: docker compose down -v
